<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticker Pro — Full Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../data.js"></script>
<script src="../dashboard-shared.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.ticker{background:#1e293b;overflow:hidden;padding:12px 0;border-bottom:1px solid #334155}
.ticker-inner{display:flex;animation:ticker 20s linear infinite;white-space:nowrap}
.ticker-item{padding:0 32px;font-size:14px}.ticker-item .up{color:#10B981}.ticker-item .down{color:#EF4444}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.container{max-width:1400px;margin:0 auto;padding:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.kpi-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center;position:relative}
.kpi-value{font-size:32px;font-weight:700}
.kpi-label{font-size:12px;color:#94a3b8;text-transform:uppercase;margin-bottom:8px}
.filter-bar,.export-bar{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.filter-btn,.action-btn,.export-btn{padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:13px;transition:.2s}
.filter-btn.active,.action-btn:hover,.export-btn:hover{background:#3B82F6;color:#fff;border-color:#3B82F6}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:12px;color:#94a3b8;border-bottom:1px solid #334155;font-size:12px;text-transform:uppercase;text-align:left}
td{padding:12px;border-bottom:1px solid #1e293b}
tr:hover td{background:#1e293b;cursor:pointer}
.alert-row td{background:rgba(239,68,68,0.1)!important}
.inline-spark{display:flex;align-items:flex-end;height:24px;gap:1px;width:80px}
.inline-spark div{flex:1;background:#10B981;border-radius:1px;min-height:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600}
.badge-danger{background:#EF4444;color:#fff}.badge-warning{background:#F59E0B;color:#000}.badge-success{background:#10B981;color:#fff}
.compare-bar{background:rgba(59,130,246,0.1);border:1px dashed #3B82F6;border-radius:12px;padding:12px;margin:16px 0;display:none;align-items:center;gap:12px;flex-wrap:wrap}
.compare-bar.active{display:flex}
.table-section{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:24px 0}
.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.table-title{font-size:16px;font-weight:600}
@media(max-width:768px){.container{padding:16px}h1{font-size:20px}.ticker-inner{animation-duration:10s}.ticker-item{font-size:12px;padding:0 16px}.kpi-grid{grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.kpi-card{padding:16px}.kpi-value{font-size:22px}.kpi-label{font-size:11px}.filter-bar,.export-bar{gap:6px;margin:12px 0}.filter-btn,.action-btn,.export-btn{padding:5px 10px;font-size:12px}.table-section{padding:16px;margin:16px 0}.table-header{flex-direction:column;align-items:flex-start;gap:8px}table{font-size:12px}th,td{padding:8px 10px}.table-title{font-size:14px}.compare-bar{padding:10px;gap:8px;margin:12px 0}}
@media(max-width:480px){.container{padding:12px}h1{font-size:18px}.ticker{padding:8px 0}.ticker-item{font-size:11px;padding:0 10px}.kpi-grid{grid-template-columns:1fr}.kpi-value{font-size:20px}table{font-size:11px;min-width:700px;overflow-x:auto;display:block}th,td{padding:6px 8px}.chart-wrapper{height:220px}.compare-bar{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="ticker"><div class="ticker-inner" id="ticker"></div></div>

<div class="container">
<!-- Time Filter -->
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
  <h1>📊 Ticker Pro Analytics</h1>
  <div class="filter-bar">
    <button class="filter-btn active" data-period="all">Tất cả</button>
    <button class="filter-btn" data-period="ytd">YTD</button>
    <button class="filter-btn" data-period="q1">Q1</button>
    <button class="filter-btn" data-period="q2">Q2</button>
  </div>
</div>

<!-- Compare -->
<div class="compare-bar" id="compareBar">
  <span>So sánh:</span>
  <span id="cmp1" class="badge" style="cursor:pointer;background:#3B82F6;color:#fff">Chọn 1</span>
  <span>vs</span>
  <span id="cmp2" class="badge" style="cursor:pointer;background:#3B82F6;color:#fff">Chọn 2</span>
  <button class="action-btn" onclick="runCompare()">🔍 So sánh</button>
  <button class="action-btn" onclick="clearCompare()">✕</button>
</div>

<!-- KPI -->
<div class="kpi-grid" id="kpi"></div>

<!-- Area Filter -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="filterArea('all')">Tất cả</button>
  <button class="filter-btn" onclick="filterArea('Đồng Nai')">Đồng Nai</button>
  <button class="filter-btn" onclick="filterArea('Bình Dương')">Bình Dương</button>
</div>

<!-- Render All Tables inline for Ticker -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">📈 Dự án theo Sell-through</span>
    <div>
      <button class="action-btn" onclick="sortTicker('asc')">⬆️ Thấp → Cao</button>
      <button class="action-btn" onclick="sortTicker('desc')">⬇️ Cao → Thấp</button>
      <button class="action-btn" onclick="toggleCompare()">🔄 So sánh</button>
      <button class="export-btn" onclick="exportMain()">📥 CSV</button>
    </div>
  </div>
  <table id="mainTable">
    <thead><tr><th>#</th><th>Dự án</th><th>Khu vực</th><th>Giá trị (tỷ)</th><th>Sell-through</th><th>SP</th><th>Vướng</th><th>Trạng thái</th><th>Trend</th></tr></thead>
    <tbody id="mainBody"></tbody>
  </table>
</div>

<!-- Stuck -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">⚠️ Chi tiết vướng mắc</span>
    <button class="export-btn" onclick="exportStuck()">📥 CSV</button>
  </div>
  <table>
    <thead><tr><th>Dự án</th><th>Khu vực</th><th>SP Vướng</th><th>% Vướng</th><th>Giá trị vướng</th><th>Cảnh báo</th></tr></thead>
    <tbody id="stuckBody"></tbody>
  </table>
</div>

<!-- Region -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">🗺️ So sánh khu vực</span>
  </div>
  <table>
    <thead><tr><th>Chỉ số</th><th>Đồng Nai</th><th>Bình Dương</th><th>TP.HCM</th><th>Chênh lệch ĐN-BD</th></tr></thead>
    <tbody id="regionBody"></tbody>
  </table>
</div>

<!-- Export -->
<div style="text-align:center;margin:32px 0">
  <button class="action-btn" style="padding:12px 32px;font-size:16px;background:#3B82F6" onclick="exportAllTicker()">📥 Xuất toàn bộ báo cáo</button>
</div>
</div>

<!-- Detail Modal -->
<div class="dash-modal" id="detailModal">
  <div class="dash-modal-overlay" onclick="closeModal('detailModal')"></div>
  <div class="dash-modal-content" style="background:#1e293b;border-color:#334155">
    <div class="dash-modal-header"><h3 id="detailTitle">Chi tiết</h3><button onclick="closeModal('detailModal')" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer">&times;</button></div>
    <div class="dash-modal-body" id="detailBody"></div>
  </div>
</div>

<script>
var data = cloneData();
enrichProjectData(data.topProjects);
var allProjects = data.topProjects;
var compareList = [];

function renderKPI(){
  var t = data.total;
  var stuckRate = (t.stuck/t.products*100).toFixed(1);
  document.getElementById('kpi').innerHTML=
    '<div class="kpi-card"><div class="kpi-label">Tổng giá trị</div><div class="kpi-value">'+fmtVND(t.value)+'</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Tổng SP</div><div class="kpi-value">'+fmtNum(t.products)+'</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Sell-through</div><div class="kpi-value" style="color:'+(t.sellThroughRate<30?'#EF4444':'')+'">'+t.sellThroughRate+'%</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">SP Vướng mắc</div><div class="kpi-value" style="color:'+(stuckRate>10?'#EF4444':'')+'">'+t.stuck+' ('+stuckRate+'%)</div></div>';
}

function renderTicker(filter){
  var filtered = filter==='all'?allProjects:allProjects.filter(function(p){return p.area===filter;});
  document.getElementById('ticker').innerHTML=filtered.map(function(p){
    return '<span class="ticker-item"><b>'+p.name+'</b> '+fmtVND(p.value)+' <span class="'+(p.sellThroughRate>30?'up':'down')+'">'+p.sellThroughRate+'%</span></span>';
  }).join('')+filtered.map(function(p){
    return '<span class="ticker-item"><b>'+p.name+'</b> '+fmtVND(p.value)+' <span class="'+(p.sellThroughRate>30?'up':'down')+'">'+p.sellThroughRate+'%</span></span>';
  }).join('');
  document.getElementById('mainBody').innerHTML=filtered.map(function(p,i){
    return '<tr class="'+(p.alertLevel==='danger'?'alert-row':'')+'" onclick="openDetail(\''+p.name+'\')">'+
      '<td>'+(i+1)+'</td><td><strong>'+p.name+'</strong></td><td>'+p.area+'</td>'+
      '<td>'+fmtVND(p.value)+'</td>'+
      '<td style="color:'+(p.sellThroughRate<30?'#EF4444':'#10B981')+'">'+p.sellThroughRate+'%</td>'+
      '<td>'+fmtNum(p.products)+'</td>'+
      '<td>'+(p.stuck||0)+' <small>('+(p.stuckPct||0)+'%)</small></td>'+
      '<td>'+getAlertBadge(p.alertLevel)+'</td>'+
      '<td><div class="inline-spark">'+Array(7).fill(0).map(function(){return'<div style="height:'+(20+Math.random()*80)+'%">';}).join('')+'</div></td></tr>';
  }).join('');
}

function renderStuck(){
  document.getElementById('stuckBody').innerHTML=data.topProjects.slice().sort(function(a,b){return b.stuckPct-a.stuckPct;}).map(function(p){
    return '<tr onclick="openDetail(\''+p.name+'\')">'+
      '<td><strong>'+p.name+'</strong></td><td>'+p.area+'</td>'+
      '<td>'+(p.stuck||0)+'</td>'+
      '<td style="color:'+(p.stuckPct>10?'#EF4444':'#10B981')+'">'+p.stuckPct+'%</td>'+
      '<td>'+fmtVND(p.stuckValue||0)+'</td>'+
      '<td>'+getAlertBadge(p.stuckLevel)+'</td></tr>';
  }).join('');
}

function renderRegion(){
  var labels = [{l:'Dự án',k:'projects'},{l:'SP',k:'products'},{l:'Giá trị',k:'value',fmt:fmtVND},{l:'Sell-through %',k:'sellThroughRate',fmt:function(v){return v+'%';}}];
  document.getElementById('regionBody').innerHTML=labels.map(function(r){
    var dn=data.regions[0][r.k],bd=data.regions[1][r.k],tphcm=data.regions[2][r.k];
    var diff=(typeof dn==='number'&&typeof bd==='number')?(dn-bd).toFixed(1):'—';
    var f=r.fmt||function(v){return v;};
    return '<tr><td><strong>'+r.l+'</strong></td><td>'+f(dn)+'</td><td>'+f(bd)+'</td><td>'+f(tphcm)+'</td><td style="color:'+(diff>0?'#10B981':'#EF4444')+'">'+diff+'</td></tr>';
  }).join('');
}

function openDetail(name){
  var html=renderProjectDetail(name,data);
  document.getElementById('detailTitle').textContent=name;
  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailModal').classList.add('active');
}

function filterArea(area){renderTicker(area);}
function sortTicker(dir){
  data.topProjects.sort(function(a,b){return dir==='asc'?a.sellThroughRate-b.sellThroughRate:b.sellThroughRate-a.sellThroughRate;});
  renderTicker('all');
}

function toggleCompare(){document.getElementById('compareBar').classList.toggle('active');compareList=[];}
function runCompare(){if(compareList.length<2){alert('Chọn 2 dự án');return;}var p1=data.topProjects.find(function(x){return x.name===compareList[0];}),p2=data.topProjects.find(function(x){return x.name===compareList[1];});alert('So sánh: '+p1.name+' vs '+p2.name+'\n\nSell-through: '+p1.sellThroughRate+'% vs '+p2.sellThroughRate+'%');}
function clearCompare(){compareList=[];document.getElementById('compareBar').classList.remove('active');}

function exportMain(){exportToCSV('mainTable','ticker-main');}
function exportStuck(){var t=document.createElement('table');t.innerHTML=document.querySelectorAll('table')[1].outerHTML;document.body.appendChild(t);exportToCSV(t,'ticker-stuck');t.remove();}
function exportAllTicker(){exportMain();exportStuck();alert('Đã xuất!');}

// Time filter
document.querySelectorAll('.filter-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});this.classList.add('active');});});

document.addEventListener('DOMContentLoaded',function(){renderKPI();renderTicker('all');renderStuck();renderRegion();});
</script>
</body>
</html>
