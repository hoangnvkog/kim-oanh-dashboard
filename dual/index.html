<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Mode — Tồn Kho</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--accent:#3B82F6}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0}
.container{max-width:1200px;margin:0 auto;padding:24px}
.toggle-bar{display:flex;gap:8px;margin-bottom:24px;background:var(--card);padding:8px;border-radius:12px;width:fit-content}
.toggle-btn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;background:transparent;color:var(--text)}
.toggle-btn.active{background:var(--accent);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px}
.kpi-value{font-size:28px;font-weight:700;color:var(--accent)}.kpi-label{font-size:12px;text-transform:uppercase;opacity:0.7}
.chart-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
.chart-wrapper{height:250px}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
th{padding:12px;border-bottom:1px solid #334155;font-size:12px;text-transform:uppercase;opacity:0.7;text-align:left}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05)}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<h1 style="margin-bottom:16px">🎨 Dual Mode Analytics</h1>
<div class="toggle-bar"><button class="toggle-btn active" onclick="setTheme('dark')">🌙 Dark</button>
<button class="toggle-btn" onclick="setTheme('light')">☀️ Light</button>
<button class="toggle-btn" onclick="setTheme('warm')">🌅 Warm</button></div>
<div class="kpi-grid" id="kpi"></div>
<div class="chart-card"><div class="chart-wrapper"><canvas id="regionChart"></canvas></div></div>
<div class="chart-card"><div class="chart-wrapper"><canvas id="statusChart"></canvas></div></div>
<div class="chart-card"><div class="chart-wrapper"><canvas id="trendChart"></canvas></div></div>
<table><thead><tr><th>Dự án</th><th>Khu vực</th><th>SP</th><th>Giá trị (tỷ)</th><th>Sell-through</th></tr></thead><tbody id="tbl"></tbody></table>
</div>
<script>
function render(){
document.getElementById('kpi').innerHTML='<div class="kpi-card"><div class="kpi-label">Tổng GT</div><div class="kpi-value">'+fmtVND(inventoryData.total.value)+'</div></div>'+
'<div class="kpi-card"><div class="kpi-label">SP</div><div class="kpi-value">'+fmtNum(inventoryData.total.products)+'</div></div>'+
'<div class="kpi-card"><div class="kpi-label">Sell-through</div><div class="kpi-value">'+inventoryData.total.sellThroughRate+'%</div></div>'+
'<div class="kpi-card"><div class="kpi-label">Vướng</div><div class="kpi-value">'+inventoryData.total.stuck+'</div></div>';
document.getElementById('tbl').innerHTML=inventoryData.topProjects.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.area+'</td><td>'+fmtNum(p.products)+'</td><td>'+fmtVND(p.value)+'</td><td>'+p.sellThroughRate+'%</td></tr>';}).join('');
}
function setTheme(m){
var r=document.documentElement;
if(m==='dark'){r.style.setProperty('--bg','#0f172a');r.style.setProperty('--card','#1e293b');r.style.setProperty('--text','#e2e8f0');r.style.setProperty('--accent','#3B82F6');}
if(m==='light'){r.style.setProperty('--bg','#f8fafc');r.style.setProperty('--card','#ffffff');r.style.setProperty('--text','#1e293b');r.style.setProperty('--accent','#2563EB');}
if(m==='warm'){r.style.setProperty('--bg','#FFF8F0');r.style.setProperty('--card','#FFF5EB');r.style.setProperty('--text','#4A3728');r.style.setProperty('--accent','#D97706');}
document.querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active');});
event.target.classList.add('active');
}
document.addEventListener('DOMContentLoaded', function(){
render();
new Chart(document.getElementById('regionChart'),{type:'bar',data:{labels:inventoryData.regions.map(function(r){return r.name;}),datasets:[{label:'Giá trị (tỷ)',data:inventoryData.regions.map(function(r){return r.value;}),backgroundColor:inventoryData.regions.map(function(r){return r.color;})}]},options:{responsive:true,maintainAspectRatio:false}});
new Chart(document.getElementById('statusChart'),{type:'pie',data:{labels:inventoryData.status.map(function(s){return s.label;}),datasets:[{data:inventoryData.status.map(function(s){return s.count;}),backgroundColor:inventoryData.status.map(function(s){return s.color;})}]},options:{responsive:true,maintainAspectRatio:false}});
new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:inventoryData.monthlyTrend.map(function(m){return m.month;}),datasets:[{label:'Đã bán',data:inventoryData.monthlyTrend.map(function(m){return m.sold;}),borderColor:'#3B82F6',tension:0.4},{label:'Vướng mắc mới',data:inventoryData.monthlyTrend.map(function(m){return m.newStuck;}),borderColor:'#EF4444',tension:0.4}]},options:{responsive:true,maintainAspectRatio:false}});
});
</script>
</body>
</html>
