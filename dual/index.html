<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Mode — Tồn Kho (Full)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3B82F6;--danger:#EF4444;--success:#10B981;--warning:#F59E0B}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0}
.container{max-width:1400px;margin:0 auto;padding:24px}
.toggle-bar{display:flex;gap:8px;margin-bottom:24px;background:var(--card);padding:8px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.toggle-btn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;background:transparent;color:var(--text)}
.toggle-btn.active{background:var(--accent);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px;position:relative}
.kpi-value{font-size:28px;font-weight:700;color:var(--accent)}
.kpi-label{font-size:12px;text-transform:uppercase;opacity:0.7}
.kpi-alert{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.chart-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
.chart-wrapper{height:250px}
.table-section{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:24px}
.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.table-title{font-size:18px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:12px;border-bottom:1px solid #334155;font-size:12px;text-transform:uppercase;opacity:0.7;text-align:left;white-space:nowrap}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05)}
tr:hover td{background:rgba(255,255,255,0.03);cursor:pointer}
.alert-row{background:rgba(239,68,68,0.1)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600}
.badge-danger{background:var(--danger);color:#fff}
.badge-warning{background:var(--warning);color:#000}
.badge-success{background:var(--success);color:#fff}
.filter-btn, .export-btn, .action-btn{padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#334155;color:var(--text);cursor:pointer;font-size:13px;transition:.2s}
.filter-btn:hover, .action-btn:hover{background:var(--accent);border-color:var(--accent)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:24px}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid #334155;border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-close{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}
.project-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:16px 0}
.detail-item{background:rgba(255,255,255,0.03);padding:12px;border-radius:8px}
.detail-label{font-size:12px;opacity:0.7;text-transform:uppercase;margin-bottom:4px}
.detail-value{font-size:18px;font-weight:700}
.compare-bar{background:rgba(59,130,246,0.1);border:1px dashed #3B82F6;border-radius:12px;padding:12px;margin-bottom:16px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
.compare-bar.active{display:flex}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<h1 style="margin-bottom:8px">🎨 Dual Mode Analytics</h1>

<!-- Theme + Filter -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
  <div class="toggle-bar">
    <button class="toggle-btn active" onclick="setTheme('dark')">🌙 Dark</button>
    <button class="toggle-btn" onclick="setTheme('light')">☀️ Light</button>
    <button class="toggle-btn" onclick="setTheme('warm')">🌅 Warm</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="filter-btn" data-period="all">Tất cả</button>
    <button class="filter-btn" data-period="ytd">YTD</button>
    <button class="filter-btn" data-period="q1">Q1</button>
    <button class="filter-btn" data-period="q2">Q2</button>
  </div>
</div>

<!-- Compare Bar -->
<div class="compare-bar" id="compareBar">
  <span>So sánh:</span>
  <span id="compare1" class="badge" style="cursor:pointer">Chọn 1</span>
  <span>vs</span>
  <span id="compare2" class="badge" style="cursor:pointer">Chọn 2</span>
  <button class="action-btn" onclick="runCompare()">🔍 So sánh</button>
  <button class="action-btn" onclick="clearCompare()">✕</button>
</div>

<!-- KPI -->
<div class="kpi-grid" id="kpi"></div>

<!-- Charts -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;margin-bottom:16px">
  <div class="chart-card"><div class="chart-wrapper"><canvas id="regionChart"></canvas></div></div>
  <div class="chart-card"><div class="chart-wrapper"><canvas id="statusChart"></canvas></div></div>
</div>
<div class="chart-card" style="margin-bottom:24px"><div class="chart-wrapper"><canvas id="trendChart"></canvas></div></div>

<!-- C.1: Vướng mắc chi tiết -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">⚠️ Vướng mắc chi tiết</span>
    <div>
      <button class="export-btn" onclick="exportTable('stuckTable','vuong-mac')">📥 CSV</button>
      <button class="export-btn" onclick="printTable('stuckTable')">🖨️ In</button>
    </div>
  </div>
  <table id="stuckTable">
    <thead><tr><th>Dự án</th><th>Khu vực</th><th>Tổng SP</th><th>Vướng</th><th>% Vướng</th><th>Giá trị vướng</th><th>Cảnh báo</th></tr></thead>
    <tbody id="stuckBody"></tbody>
  </table>
</div>

<!-- C.2: So sánh khu vực -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">🗺️ So sánh khu vực</span>
    <button class="export-btn" onclick="exportTable('regionTable','so-sanh')">📥 CSV</button>
  </div>
  <table id="regionTable">
    <thead><tr><th>Chỉ số</th><th>Đồng Nai</th><th>Bình Dương</th><th>TP.HCM</th><th>Chênh lệch ĐN-BD</th></tr></thead>
    <tbody id="regionBody"></tbody>
  </table>
</div>

<!-- C.3: Dự án theo sell-through -->
<div class="table-section">
  <div class="table-header">
    <span class="table-title">📈 Dự án theo Sell-through</span>
    <div>
      <button class="action-btn" onclick="sortSellThrough('asc')">⬆️ Thấp → Cao</button>
      <button class="action-btn" onclick="sortSellThrough('desc')">⬇️ Cao → Thấp</button>
      <button class="action-btn" onclick="toggleCompare()">🔄 So sánh</button>
      <button class="export-btn" onclick="exportTable('sellTable','sellthrough')">📥 CSV</button>
    </div>
  </div>
  <table id="sellTable">
    <thead><tr><th>#</th><th>Dự án</th><th>Khu vực</th><th>Sell-through</th><th>Đã bán</th><th>Chưa bán</th><th>Tồn</th><th>Giá trị</th><th>Trạng thái</th><th>Đề xuất</th></tr></thead>
    <tbody id="sellBody"></tbody>
  </table>
</div>

<!-- Export All -->
<div style="text-align:center;margin:32px 0">
  <button class="action-btn" style="padding:12px 32px;font-size:16px;background:var(--accent);border-color:var(--accent);color:#fff" onclick="exportAll()">📥 Xuất toàn bộ báo cáo</button>
</div>

</div>

<!-- Drill-down Modal -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header"><h3 id="modalTitle">Chi tiết dự án</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ================== DATA & HELPERS ==================
var data = JSON.parse(JSON.stringify(inventoryData));

// Calculate derived fields
data.topProjects.forEach(function(p) {
  p.stuckPct = p.products ? ((p.stuck || 0) / p.products * 100).toFixed(1) : 0;
  p.stuckValuePct = p.value ? ((p.stuckValue || 0) / p.value * 100).toFixed(1) : 0;
  if (p.sellThroughRate < 20) { p.alertLevel='danger'; p.action='Cần đẩy mạnh'; }
  else if (p.sellThroughRate < 35) { p.alertLevel='warning'; p.action='Theo dõi'; }
  else { p.alertLevel='success'; p.action='Tốt'; }
});

function getAlertBadge(level) {
  return level==='danger' ? '<span class="badge badge-danger">⚠️ Cao</span>' :
    level==='warning' ? '<span class="badge badge-warning">△ TB</span>' :
    '<span class="badge badge-success">✓ Thấp</span>';
}

// ================== RENDER ==================
function renderKPI() {
  var t = data.total;
  var stuckRate = (t.stuck/t.products*100).toFixed(1);
  var html = '<div class="kpi-card">' + (t.sellThroughRate<30 ? '<span class="kpi-alert">!</span>':'') +
    '<div class="kpi-label">Tổng GT</div>' +
    '<div class="kpi-value">' + fmtVND(t.value) + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">SP</div><div class="kpi-value">' + fmtNum(t.products) + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Sell-through</div>' +
    '<div class="kpi-value" style="color:' + (t.sellThroughRate<30?'var(--danger)':'var(--success)') + '">' + t.sellThroughRate + '%</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Vướng</div>' +
    '<div class="kpi-value" style="color:' + (stuckRate>10?'var(--danger)':'var(--warning)') + '">' + t.stuck + ' (' + stuckRate + '%)</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Thanh lý</div><div class="kpi-value">' + fmtNum(t.liquidation) + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Turnover</div><div class="kpi-value">' + t.stockTurnover + '</div></div>';
  document.getElementById('kpi').innerHTML = html;
}

// C.1: Vướng mắc chi tiết
function renderStuck() {
  var sorted = data.topProjects.slice().sort(function(a,b){return b.stuckPct - a.stuckPct;});
  document.getElementById('stuckBody').innerHTML = sorted.map(function(p) {
    return '<tr onclick="openDetail(\'' + p.name + '\')" class="' + (p.stuckPct>10?'alert-row':'') + '">' +
      '<td><strong>' + p.name + '</strong></td>' +
      '<td>' + p.area + '</td>' +
      '<td>' + fmtNum(p.products) + '</td>' +
      '<td>' + (p.stuck||0) + '</td>' +
      '<td style="color:' + (p.stuckPct>10?'var(--danger)':'var(--success)') + '">' + p.stuckPct + '%</td>' +
      '<td>' + (p.stuckValue ? fmtVND(p.stuckValue) : '—') + '</td>' +
      '<td>' + getAlertBadge(p.stuckPct>10?'danger':p.stuckPct>5?'warning':'success') + '</td>' +
      '</tr>';
  }).join('');
}

// C.2: So sánh khu vực
function renderRegionComp() {
  var rows = [
    {label:'Dự án', k:'projects'}, {label:'Sản phẩm', k:'products'}, 
    {label:'Giá trị', k:'value', fmt:fmtVND}, {label:'Sell-through %', k:'sellThroughRate', fmt:function(v){return v+'%';}};
  }];
  
  document.getElementById('regionBody').innerHTML = rows.map(function(r) {
    var dn = data.regions[0][r.k], bd = data.regions[1][r.k], tphcm = data.regions[2][r.k];
    var diff = typeof dn === 'number' && typeof bd === 'number' ? (dn - bd).toFixed(1) : '—';
    var f = r.fmt || function(v){return v;};
    return '<tr><td><strong>' + r.label + '</strong></td>' +
      '<td>' + f(dn) + '</td><td>' + f(bd) + '</td><td>' + f(tphcm) + '</td>' +
      '<td style="color:' + (diff>0?'var(--success)':'var(--danger)') + '">' + diff + '</td></tr>';
  }).join('');
}

// C.3: Sell-through ranking
function renderSellThrough(sortDir) {
  var projects = data.topProjects.slice();
  projects.sort(function(a,b){return sortDir==='asc' ? a.sellThroughRate - b.sellThroughRate : b.sellThroughRate - a.sellThroughRate;});
  document.getElementById('sellBody').innerHTML = projects.map(function(p,i) {
    return '<tr class="' + (p.alertLevel==='danger'?'alert-row':'') + '" onclick="openDetail(\'' + p.name + '\')" data-name="' + p.name + '">' +
      '<td>#' + (i+1) + '</td>' +
      '<td><strong>' + p.name + '</strong></td>' +
      '<td>' + p.area + '</td>' +
      '<td style="color:' + (p.sellThroughRate<30?'var(--danger)':'var(--success)') + '">' + p.sellThroughRate + '%</td>' +
      '<td>' + fmtNum(p.sold||0) + '</td>' +
      '<td>' + fmtNum(p.unsold||0) + '</td>' +
      '<td>' + fmtNum(p.products) + '</td>' +
      '<td>' + fmtVND(p.value) + '</td>' +
      '<td>' + getAlertBadge(p.alertLevel) + '</td>' +
      '<td>' + p.action + '</td>' +
      '</tr>';
  }).join('');
}

// ================== DRILL-DOWN ==================
function openDetail(name) {
  var p = data.topProjects.find(function(x){return x.name===name;}); if(!p)return;
  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalBody').innerHTML = 
    '<div class="project-detail">' +
    '<div class="detail-item"><div class="detail-label">Khu vực</div><div class="detail-value">' + p.area + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Tổng SP</div><div class="detail-value">' + fmtNum(p.products) + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Giá trị</div><div class="detail-value">' + fmtVND(p.value) + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Đã bán</div><div class="detail-value" style="color:var(--success)">' + fmtNum(p.sold||0) + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Chưa bán</div><div class="detail-value" style="color:var(--warning)">' + fmtNum(p.unsold||0) + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Sell-through</div><div class="detail-value" style="color:' + (p.sellThroughRate<30?'var(--danger)':'var(--success)') + '">' + p.sellThroughRate + '%</div></div>' +
    '<div class="detail-item"><div class="detail-label">SP vướng</div><div class="detail-value" style="color:var(--danger)">' + (p.stuck||0) + '</div></div>' +
    '<div class="detail-item"><div class="detail-label">Giá trị/SP</div><div class="detail-value">' + (p.avgValue||'—') + ' tỷ</div></div>' +
    '</div>' +
    '<div style="margin-top:16px"><strong>Hành động:</strong> ' + p.action + '</div>' +
    '<div style="margin-top:16px;padding:12px;background:rgba(59,130,246,0.05);border-radius:8px">' +
    '<strong>🎯 Đề xuất chiến lược:</strong><br>' +
    (p.sellThroughRate < 20 ? '• Tăng cường marketing & sales<br>• Xem xét ưu đãi đặc biệt<br>• Review lại pricing' :
    p.sellThroughRate < 35 ? '• Duy trì momentum<br>• Theo dõi đối thủ cạnh tranh<br>• Tối ưu chi phí marketing' :
    '• Tiếp tục chiến lược hiện tại<br>• Expand sang phân khúc tương tự<br>• Case study cho các dự án khác') +
    '</div>';
  document.getElementById('detailModal').classList.add('active');
}
function closeModal(){document.getElementById('detailModal').classList.remove('active');}

// ================== COMPARE ==================
var compareList = [];
function toggleCompare(){
  var bar = document.getElementById('compareBar');
  bar.classList.toggle('active');
  compareList = [];
  if(bar.classList.contains('active')) alert('Click vào dự án để chọn so sánh');
}
function addToCompare(el){
  if(!document.getElementById('compareBar').classList.contains('active')) return;
  var name = el.dataset.name;
  if(compareList.length >= 2) compareList = [];
  compareList.push(name);
  if(compareList[0]) document.getElementById('compare1').textContent = compareList[0];
  if(compareList[1]) document.getElementById('compare2').textContent = compareList[1];
}
function runCompare(){
  if(compareList.length < 2){alert('Chọn 2 dự án để so sánh'); return;}
  var p1 = data.topProjects.find(function(x){return x.name===compareList[0];});
  var p2 = data.topProjects.find(function(x){return x.name===compareList[1];});
  alert('So sánh: ' + p1.name + ' vs ' + p2.name + '\n\n' +
    'Sell-through: ' + p1.sellThroughRate + '% vs ' + p2.sellThroughRate + '%\n' +
    'Giá trị: ' + fmtVND(p1.value) + ' vs ' + fmtVND(p2.value) + '\n' +
    'SP: ' + p1.products + ' vs ' + p2.products);
}
function clearCompare(){compareList=[];document.getElementById('compareBar').classList.remove('active');}

// ================== CHARTS ==================
function initCharts(){
  new Chart(document.getElementById('regionChart'),{type:'bar',data:{labels:data.regions.map(function(r){return r.name;}),datasets:[{label:'Giá trị (tỷ)',data:data.regions.map(function(r){return r.value;}),backgroundColor:data.regions.map(function(r){return r.color;})}]},options:{responsive:true,maintainAspectRatio:false}});
  new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:data.status.map(function(s){return s.label;}),datasets:[{data:data.status.map(function(s){return s.count;}),backgroundColor:data.status.map(function(s){return s.color;})}]},options:{responsive:true,maintainAspectRatio:false}});
  new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:data.monthlyTrend.map(function(m){return m.month;}),datasets:[{label:'Đã bán',data:data.monthlyTrend.map(function(m){return m.sold;}),borderColor:'#3B82F6',tension:0.4},{label:'Vướng mắc mới',data:data.monthlyTrend.map(function(m){return m.newStuck;}),borderColor:'#EF4444',tension:0.4}]},options:{responsive:true,maintainAspectRatio:false}});
}

// ================== EXPORT ==================
function exportTable(tableId, filename){
  var rows = document.getElementById(tableId).querySelectorAll('tr');
  var csv = 'data:text/csv;charset=utf-8,';
  rows.forEach(function(row){var cols=row.querySelectorAll('td,th'),d=[];cols.forEach(function(c){d.push(c.textContent.trim());});csv+=d.join(',')+'\n';});
  var a=document.createElement('a');a.href=encodeURI(csv);a.download=filename+'.csv';a.click();
}
function printTable(id){var w=window.open();w.document.write('<style>table{border-collapse:collapse}th,td{border:1px solid #000;padding:8px}</style>'+document.getElementById(id).outerHTML);w.print();}
function exportAll(){exportTable('stuckTable','vuong-mac');exportTable('regionTable','so-sanh');exportTable('sellTable','sellthrough');alert('Đã xuất 3 file!');}

// ================== TIME FILTER ==================
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    alert('Filter: ' + this.dataset.period + ' (demo - chưa cài đặt dữ liệu theo thời gian)');
  });
});

// ================== THEME ==================
function setTheme(m){
  var r=document.documentElement;
  if(m==='dark'){r.style.setProperty('--bg','#0f172a');r.style.setProperty('--card','#1e293b');r.style.setProperty('--text','#e2e8f0');r.style.setProperty('--accent','#3B82F6');}
  if(m==='light'){r.style.setProperty('--bg','#f8fafc');r.style.setProperty('--card','#ffffff');r.style.setProperty('--text','#1e293b');r.style.setProperty('--accent','#2563EB');}
  if(m==='warm'){r.style.setProperty('--bg','#FFF8F0');r.style.setProperty('--card','#FFF5EB');r.style.setProperty('--text','#4A3728');r.style.setProperty('--accent','#D97706');}
  event.target.classList.add('active');
  document.querySelectorAll('.toggle-btn').forEach(function(b){if(b!==event.target)b.classList.remove('active');});
}

// ================== INIT ==================
function sortSellThrough(dir){renderSellThrough(dir);}
document.addEventListener('DOMContentLoaded', function(){
  renderKPI(); initCharts(); renderStuck(); renderRegionComp(); renderSellThrough('desc');
});
document.getElementById('detailModal').addEventListener('click', function(e){if(e.target===this)closeModal();});
</script>
</body>
</html>
