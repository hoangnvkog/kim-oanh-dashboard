<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Dual Mode Analytics</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--accent:#3B82F6}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0;padding:0}
.container{max-width:1200px;margin:0 auto;padding:24px}
.toggle-bar{display:flex;gap:8px;margin-bottom:24px;background:var(--card);padding:8px;border-radius:12px;width:fit-content}
.toggle-btn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;background:transparent;color:var(--text)}
.toggle-btn.active{background:var(--accent);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px}
.kpi-value{font-size:28px;font-weight:700;color:var(--accent)}
.kpi-label{font-size:12px;text-transform:uppercase;opacity:0.7;margin-bottom:8px}
.chart-card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
.chart-wrapper{height:250px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px;border-bottom:1px solid #334155;font-size:12px;text-transform:uppercase;opacity:0.7}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05)}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
<h1>🎨 Dual Mode Analytics</h1>
<div class="toggle-bar">
<button class="toggle-btn active" onclick="setTheme('dark')">🌙 Dark</button>
<button class="toggle-btn" onclick="setTheme('light')">☀️ Light</button>
<button class="toggle-btn" onclick="setTheme('warm')">🌅 Warm</button>
</div>
</div>
<div class="kpi-grid">
<div class="kpi-card"><div class="kpi-label">Revenue</div><div class="kpi-value">$1.2M</div></div>
<div class="kpi-card"><div class="kpi-label">Growth</div><div class="kpi-value">+15.3%</div></div>
<div class="kpi-card"><div class="kpi-label">Users</div><div class="kpi-value">8,420</div></div>
<div class="kpi-card"><div class="kpi-label">Conversion</div><div class="kpi-value">3.8%</div></div>
</div>
<div class="chart-card"><div class="chart-wrapper"><canvas id="dualChart"></canvas></div></div>
<table>
<thead><tr><th>Metric</th><th>Dark</th><th>Light</th><th>Warm</th></tr></thead>
<tbody>
<tr><td>Readability</td><td>⭐⭐⭐⭐⭐</td><td>⭐⭐⭐⭐</td><td>⭐⭐⭐⭐⭐</td></tr>
<tr><td>Eye Comfort</td><td>⭐⭐⭐⭐⭐</td><td>⭐⭐⭐</td><td>⭐⭐⭐⭐</td></tr>
<tr><td>Battery Saving</td><td>⭐⭐⭐⭐⭐</td><td>⭐⭐</td><td>⭐⭐⭐</td></tr>
</tbody>
</table>
</div>
<script>
function setTheme(mode){const r=document.documentElement;if(mode==='dark'){r.style.setProperty('--bg','#0f172a');r.style.setProperty('--card','#1e293b');r.style.setProperty('--text','#e2e8f0');r.style.setProperty('--accent','#3B82F6')}if(mode==='light'){r.style.setProperty('--bg','#f8fafc');r.style.setProperty('--card','#ffffff');r.style.setProperty('--text','#1e293b');r.style.setProperty('--accent','#2563EB')}if(mode==='warm'){r.style.setProperty('--bg','#FFF8F0');r.style.setProperty('--card','#FFF5EB');r.style.setProperty('--text','#4A3728');r.style.setProperty('--accent','#D97706')}}document.querySelectorAll('.toggle-btn').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')})});new Chart(document.getElementById('dualChart'),{type:'bar',data:{labels:['Q1','Q2','Q3','Q4'],datasets:[{label:'Dark Mode Users',data:[60,65,70,75],backgroundColor:'#3B82F6'},{label:'Light Mode Users',data:[40,35,30,25],backgroundColor:'#F59E0B'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:document.documentElement.style.getPropertyValue('--text')}}},scales:{y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'var(--text)'}},x:{ticks:{color:'var(--text)'}}}}});
</script>
</body>
</html>
