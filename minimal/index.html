<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalist — Tồn Kho</title>
<script src="../data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a;min-height:100vh}
.header{text-align:center;padding:80px 24px 40px}
.header h1{font-size:48px;font-weight:700;margin-bottom:16px;letter-spacing:-1px}
.header p{font-size:18px;color:#666;margin-bottom:32px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;max-width:900px;margin:0 auto;padding:0 24px}
.kpi-card{background:#f9f9f9;border:1px solid #eee;border-radius:16px;padding:32px;text-align:center;transition:transform 0.2s}
.kpi-card:hover{transform:translateY(-4px)}
.kpi-value{font-size:40px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.kpi-label{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px}
table{width:100%;max-width:900px;margin:40px auto;border-collapse:collapse;font-size:14px}
th{padding:16px;border-bottom:2px solid #1a1a1a;font-size:12px;text-transform:uppercase;text-align:left}
td{padding:16px;border-bottom:1px solid #eee}
tr:hover{background:#f9f9f9}
.spotlight{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,0.15)}
.spotlight-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;z-index:999}
.spotlight-modal{position:fixed;top:15%;left:50%;transform:translateX(-50%);width:600px;max-width:90%;background:#fff;border-radius:16px;padding:24px;display:none;z-index:1000;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
.spotlight-modal.active,.spotlight-overlay.active{display:block}
.spotlight-input{width:100%;padding:12px;border:1px solid #eee;border-radius:8px;font-size:16px;outline:none;margin-bottom:12px}
.spotlight-results{max-height:300px;overflow-y:auto}
.spotlight-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:#1a1a1a}
.spotlight-item:hover{background:#f5f5f5}
@media(max-width:768px){.header h1{font-size:32px}}
</style>
</head>
<body>
<div class="header"><h1>Tồn Kho</h1><p>Báo cáo 20 dự án</p></div>
<div class="kpi-grid" id="kpi"></div>
<table><thead><tr><th>Dự án</th><th>Khu vực</th><th>SP</th><th>Giá trị (tỷ)</th><th>%</th></tr></thead><tbody id="tbl"></tbody></table>
<div class="spotlight" id="spotlightBtn">⌘K Spotlight</div>
<div class="spotlight-overlay" id="spotlightOverlay"></div>
<div class="spotlight-modal" id="spotlightModal"><input class="spotlight-input" placeholder="Tìm kiếm dự án, khu vực..." id="spotlightInput"><div class="spotlight-results" id="spotlightResults"></div></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
document.getElementById('kpi').innerHTML='<div class="kpi-card"><div class="kpi-value">'+fmtVND(inventoryData.total.value)+'</div><div class="kpi-label">Tổng giá trị</div></div>'+
'<div class="kpi-card"><div class="kpi-value">'+fmtNum(inventoryData.total.products)+'</div><div class="kpi-label">Sản phẩm</div></div>'+
'<div class="kpi-card"><div class="kpi-value">'+inventoryData.total.sellThroughRate+'%</div><div class="kpi-label">Sell-through Rate</div></div>'+
'<div class="kpi-card"><div class="kpi-value">'+inventoryData.total.stuck+'</div><div class="kpi-label">Vướng mắc</div></div>';
function renderTable(filter){
var filtered = filter ? inventoryData.topProjects.filter(function(p){return p.name.toLowerCase().includes(filter.toLowerCase()) || p.area.toLowerCase().includes(filter.toLowerCase());}) : inventoryData.topProjects;
document.getElementById('tbl').innerHTML=filtered.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.area+'</td><td>'+fmtNum(p.products)+'</td><td>'+fmtVND(p.value)+'</td><td>'+p.percentage+'%</td></tr>';}).join('');
}
renderTable();
 document.getElementById('spotlightBtn').addEventListener('click', function(){
  document.getElementById('spotlightModal').classList.add('active');
  document.getElementById('spotlightOverlay').classList.add('active');
  document.getElementById('spotlightInput').focus();
});
  document.getElementById('spotlightOverlay').addEventListener('click', function(){
   document.getElementById('spotlightModal').classList.remove('active');
   document.getElementById('spotlightOverlay').classList.remove('active');
  });
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='k'){e.preventDefault();document.getElementById('spotlightModal').classList.toggle('active');document.getElementById('spotlightOverlay').classList.toggle('active');if(document.getElementById('spotlightModal').classList.contains('active'))document.getElementById('spotlightInput').focus();}});
  document.getElementById('spotlightInput').addEventListener('input', function(e){
   var q=e.target.value;
   var results=inventoryData.topProjects.filter(function(p){return p.name.toLowerCase().includes(q.toLowerCase()) || p.area.toLowerCase().includes(q.toLowerCase());}).map(function(p){return '<div class="spotlight-item">'+p.name+' — '+p.area+' — '+fmtVND(p.value)+'</div>';}).join('');
    document.getElementById('spotlightResults').innerHTML=results || '<div class="spotlight-item">Không tìm thấy</div>';
   renderTable(q);
  });
});
</script>
</body>
</html>
