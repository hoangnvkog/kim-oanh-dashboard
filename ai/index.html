<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Analytics — Sản Phẩm Tồn Kho</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh}
.container{max-width:1440px;margin:0 auto;padding:24px}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);padding:32px;border-radius:16px;margin-bottom:24px;border:1px solid rgba(255,255,255,0.08)}
.header h1{font-size:28px;font-weight:700;color:#fff}
.header p{color:#94a3b8;margin-top:6px;font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:28px}
.kpi-card{background:rgba(31,41,55,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.blue::before{background:#3B82F6}.kpi-card.green::before{background:#10B981}.kpi-card.amber::before{background:#F59E0B}.kpi-card.red::before{background:#EF4444}
.kpi-label{font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.kpi-value{font-size:32px;font-weight:700;margin-top:8px}
.kpi-value.blue{color:#3B82F6}.kpi-value.green{color:#10B981}.kpi-value.amber{color:#F59E0B}.kpi-value.red{color:#EF4444}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;margin-bottom:28px}
.chart-card{background:rgba(31,41,55,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px}
.chart-title{font-size:15px;font-weight:600;color:#f3f4f6;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.ai-panel{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:16px;padding:24px;margin-bottom:24px}
.ai-text{font-family:monospace;color:#60a5fa;font-size:14px;line-height:1.6}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10B981;animation:pulse 2s infinite;margin-left:6px}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.chart-wrapper{position:relative;height:300px}
.search-box{background:rgba(17,24,39,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px;color:#f3f4f6;font-size:13px;width:260px;outline:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 14px;color:#9ca3af;font-weight:500;font-size:12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);color:#e5e7eb}
tr:hover td{background:rgba(255,255,255,0.02)}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}
.cmd-palette{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;max-width:90%;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;display:none;z-index:1000;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
.cmd-palette.active{display:block}
.cmd-input{width:100%;padding:12px;background:#0f172a;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:16px;margin-bottom:12px}
.cmd-results{max-height:300px;overflow-y:auto}
.cmd-item{padding:10px 12px;border-radius:6px;cursor:pointer;color:#e2e8f0;font-size:14px}
.cmd-item:hover{background:rgba(59,130,246,0.2)}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>AI Analytics — Tồn Kho Sản Phẩm</h1><p>Phân tích dữ liệu 20 dự án • 6,485 sản phẩm • <span class="pulse"></span><span style="color:#10B981;font-size:13px">AI Live Monitoring</span></p></div>
<div class="kpi-grid" id="kpi"></div>
<div class="ai-panel"><h3 style="color:#60a5fa;margin-bottom:12px">🧠 AI Insight</h3><div class="ai-text" id="aiText">Phân tích...</div></div>
<div class="charts-grid"><div class="chart-card"><div class="chart-title">Phân bổ theo khu vực</div><div class="chart-wrapper"><canvas id="regionChart"></canvas></div></div>
<div class="chart-card"><div class="chart-title">Top 10 dự án giá trị</div><div class="chart-wrapper"><canvas id="topChart"></canvas></div></div></div>
<div class="chart-card"><div class="chart-title">Xu hướng bán hàng 12 tháng</div><div class="chart-wrapper"><canvas id="trendChart"></canvas></div></div>
<div class="chart-card"><div class="chart-title">Trạng thái sản phẩm</div><div class="chart-wrapper"><canvas id="statusChart"></canvas></div></div>
<table><thead><tr><th>Dự án</th><th>Khu vực</th><th>Sản phẩm</th><th>Giá trị (tỷ)</th><th>% Tổng</th></tr></thead><tbody id="projTable"></tbody></table>
</div>
<div class="cmd-palette" id="cmdPalette"><input class="cmd-input" placeholder="Tìm kiếm dự án, khu vực, trạng thái..." id="cmdInput"><div class="cmd-results" id="cmdResults"></div></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
var total = inventoryData.total;
document.getElementById('kpi').innerHTML = '<div class="kpi-card blue"><div class="kpi-label">Tổng giá trị tồn kho</div><div class="kpi-value blue">' + fmtVND(total.value) + '</div></div>' +
'<div class="kpi-card green"><div class="kpi-label">Tổng sản phẩm</div><div class="kpi-value green">' + fmtNum(total.products) + '</div></div>' +
'<div class="kpi-card amber"><div class="kpi-label">Sell-through Rate</div><div class="kpi-value amber">' + total.sellThroughRate + '%</div></div>' +
'<div class="kpi-card red"><div class="kpi-label">SP vướng mắc</div><div class="kpi-value red">' + total.stuck + ' (' + fmtNum(total.stuck) + ')</div></div>';
var insights = [
'TAM PHƯỚC chiếm ' + inventoryData.topProjects[0].percentage + '% giá trị tồn kho — cần ưu tiên xử lý.',
'Top 3 dự án (' + inventoryData.topProjects[0].name + ', ' + inventoryData.topProjects[1].name + ', ' + inventoryData.topProjects[2].name + ') chiếm ' + (inventoryData.topProjects[0].percentage+inventoryData.topProjects[1].percentage+inventoryData.topProjects[2].percentage).toFixed(1) + '% tổng giá trị.',
'Bình Dương có ' + inventoryData.regions[1].products + ' SP (' + inventoryData.regions[1].percentage + '% giá trị) nhưng tỷ lệ bán ' + inventoryData.regions[1].sellRate + '% cao nhất.',
'Vướng mắc: ' + inventoryData.stuckProjects.length + ' dự án, tổng ' + fmtNum(total.stuck) + ' SP cần xử lý.'
];
var i=0;
document.getElementById('aiText').textContent=insights[0];
setInterval(function(){
document.getElementById('aiText').textContent=insights[i];
i=(i+1)%insights.length;
},4000);
new Chart(document.getElementById('regionChart'),{type:'doughnut',data:{labels:inventoryData.regions.map(function(r){return r.name;}),datasets:[{data:inventoryData.regions.map(function(r){return r.value;}),backgroundColor:inventoryData.regions.map(function(r){return r.color;})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e2e8f0'}}}}});
new Chart(document.getElementById('topChart'),{type:'bar',data:{labels:inventoryData.topProjects.map(function(p){return p.name;}),datasets:[{data:inventoryData.topProjects.map(function(p){return p.value;}),backgroundColor:inventoryData.topProjects.map(function(p){return p.color;})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9ca3af'}},y:{ticks:{color:'#9ca3af'}}}}});
new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:inventoryData.monthlyTrend.map(function(m){return m.month;}),datasets:[{label:'Đã bán',data:inventoryData.monthlyTrend.map(function(m){return m.sold;}),borderColor:'#3B82F6',tension:0.4,fill:true},{label:'Vướng mắc mới',data:inventoryData.monthlyTrend.map(function(m){return m.newStuck;}),borderColor:'#EF4444',tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e2e8f0'}}}}});
new Chart(document.getElementById('statusChart'),{type:'pie',data:{labels:inventoryData.status.map(function(s){return s.label;}),datasets:[{data:inventoryData.status.map(function(s){return s.count;}),backgroundColor:inventoryData.status.map(function(s){return s.color;})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e2e8f0'}}}}});
document.getElementById('projTable').innerHTML=inventoryData.topProjects.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.area+'</td><td>'+fmtNum(p.products)+'</td><td>'+fmtVND(p.value)+'</td><td>'+p.percentage+'%</td></tr>';}).join('');
// Command Palette
document.addEventListener('keydown', function(e){
if(e.ctrlKey && e.key === 'k' || e.metaKey && e.key === 'k'){
e.preventDefault();
 document.getElementById('cmdPalette').classList.toggle('active');
 if(document.getElementById('cmdPalette').classList.contains('active')){
  document.getElementById('cmdInput').focus();
 }
}
if(e.key === 'Escape'){
 document.getElementById('cmdPalette').classList.remove('active');
}
});
 document.getElementById('cmdInput').addEventListener('input', function(e){
var q = e.target.value.toLowerCase();
var results = inventoryData.topProjects.filter(function(p){return p.name.toLowerCase().includes(q) || p.area.toLowerCase().includes(q);}).map(function(p){return '<div class="cmd-item">' + p.name + ' — ' + p.area + ' — ' + fmtVND(p.value) + '</div>';}).join('');
 document.getElementById('cmdResults').innerHTML = results || '<div class="cmd-item">Không tìm thấy</div>';
});
});
</script>
</body>
</html>
