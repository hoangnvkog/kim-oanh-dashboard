<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>AI Analytics Command Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh}
.container{max-width:1440px;margin:0 auto;padding:24px}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);padding:32px;border-radius:16px;margin-bottom:24px;border:1px solid rgba(255,255,255,0.08)}
.header h1{font-size:28px;font-weight:700;color:#fff}
.header p{color:#94a3b8;margin-top:6px;font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:28px}
.kpi-card{background:rgba(31,41,55,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.blue::before{background:#3B82F6}.kpi-card.green::before{background:#10B981}.kpi-card.amber::before{background:#F59E0B}.kpi-card.red::before{background:#EF4444}
.kpi-label{font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.kpi-value{font-size:32px;font-weight:700;margin-top:8px}
.kpi-value.blue{color:#3B82F6}.kpi-value.green{color:#10B981}.kpi-value.amber{color:#F59E0B}.kpi-value.red{color:#EF4444}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;margin-bottom:28px}
.chart-card{background:rgba(31,41,55,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px}
.chart-title{font-size:15px;font-weight:600;color:#f3f4f6;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.ai-panel{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:16px;padding:24px;margin-bottom:24px}
.ai-text{font-family:monospace;color:#60a5fa;font-size:14px;line-height:1.6}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10B981;animation:pulse 2s infinite;margin-left:6px}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.command-btn{background:#3B82F6;color:#fff;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;margin-top:12px}
.chart-wrapper{position:relative;height:300px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🤖 AI Analytics Command Center</h1>
<p>Real-time insights powered by artificial intelligence</p>
<span class="pulse"></span> <span style="color:#10B981;font-size:13px">Live AI Monitoring</span>
<button class="command-btn" onclick="alert('Press Ctrl+K for Command Palette')">⌘ Command Palette</button>
</div>
<div class="kpi-grid">
<div class="kpi-card blue"><div class="kpi-label">AI Predicted Revenue</div><div class="kpi-value blue">$2.4M</div></div>
<div class="kpi-card green"><div class="kpi-label">Anomaly Score</div><div class="kpi-value green">98.2%</div></div>
<div class="kpi-card amber"><div class="kpi-label">Active Models</div><div class="kpi-value amber">12</div></div>
<div class="kpi-card red"><div class="kpi-label">Risk Alerts</div><div class="kpi-value red">3</div></div>
</div>
<div class="ai-panel">
<h3 style="color:#60a5fa;margin-bottom:12px">🧠 AI Insight</h3>
<div class="ai-text" id="aiType">Analyzing data patterns...</div>
</div>
<div class="charts-grid">
<div class="chart-card"><div class="chart-title">Predictive Trends</div><div class="chart-wrapper"><canvas id="chart1"></canvas></div></div>
<div class="chart-card"><div class="chart-title">Anomaly Detection</div><div class="chart-wrapper"><canvas id="chart2"></canvas></div></div>
</div>
</div>
<script>
new Chart(document.getElementById('chart1'),{type:'line',data:{labels:['Jan','Feb','Mar','Apr','May','Jun'],datasets:[{label:'Actual',data:[65,78,90,81,95,110],borderColor:'#3B82F6',tension:0.4,fill:true,backgroundColor:'rgba(59,130,246,0.2)'},{label:'AI Predicted',data:[68,80,92,83,97,112],borderColor:'#10B981',borderDash:[5,5],tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e2e8f0'}}},scales:{y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#9ca3af'}},x:{ticks:{color:'#9ca3af'}}}}});
new Chart(document.getElementById('chart2'),{type:'bar',data:{labels:['Q1','Q2','Q3','Q4'],datasets:[{label:'Normal',data:[80,85,90,88],backgroundColor:'#3B82F6'},{label:'Anomaly',data:[5,12,3,8],backgroundColor:'#EF4444'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e2e8f0'}}},scales:{y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#9ca3af'}},x:{ticks:{color:'#9ca3af'}}}}});
const insights=["Revenue spike detected in Q2 - AI suggests inventory increase","Customer churn rate decreasing by 12% YoY","Supply chain anomaly probability: LOW (3.2%)"];let i=0;setInterval(()=>{document.getElementById('aiType').textContent=insights[i];i=(i+1)%insights.length},3000);
</script>
</body>
</html>
